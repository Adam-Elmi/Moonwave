[package]
name = "moonwave"
version = "1.1.0"
description = "A music player that lets you download your favorite songs from YouTube"
authors = ["Adam Elmi"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "moonwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
lofty = "0.25.4"
tauri-plugin-dialog = "2"
uuid = { version = "1.29.0", features = ["v4"] }
sha2 = "0.11.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
webp = "0.3.1"
souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
ureq = "3.5.0"
trash = "5.2.9"
rustfft = "6.4.1"
tauri-plugin-opener = "2"
